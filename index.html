<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horários Kennedy</title>
</head>
<body>
    <header></header>
    <main>
        <table>
            <thead>
                <th>Horário / Dia</th>
                <th>Segunda-feira</th>
                <th>Terça-feira</th>
                <th>Quarta-feira</th>
                <th>Quinta-feira</th>
                <th>Sexta-feira</th>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <ul>
                            <li>7h20</li>
                            <li>8h10</li>
                            <li>9h00</li>
                            <li>10h05</li>
                            <li>10h55</li>
                            <li>11h45</li>
                        </ul>

                    </td>
                    <td id = "segunda"> </td>
                     <td id = "Terça"> </td>
                      <td id = "quarta"> </td>
                       <td id = "quinta"> </td>
                        <td id = "sexta"> </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <button onclick="carregar_horario('segunda')">carregar</button>
                    </td>
                    <td>
                        <button onclick="carregar_horario('terça')">carregar</button>
                    </td>
                    <td>
                        <button onclick="carregar_horario('quarta')">carregar</button>
                    </td>
                    <td>
                        <button onclick="carregar_horario('quinta')">carregar</button>
                    </td>
                    <td>
                        <button onclick="carregar_horario('sexta')">carregar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
    <footer></footer>

    <script>

       async function carregar_horario(dia){
         const coluna_dia = documento.getElementbyId(dia)
          try {
            const link = "http//localhost:3000/horario/" + dia
            const consulta_api = await fetch(link)
            if (consulta_api.ok) {
                const aulas_dia = await consulta_api.json()
                if ( aulas_dia.lenght == 0) {
                    coluna_dia.innerHTML = "nenhuma aula cadastrada!"
                } else {
                    console,log(aulas_dia)
                    coluna_dia.innerHTML = "<ul>"
                        aulas_dia.forEach((aula) => {
                            coluna_dia.innerHTML += "<li>"
                        })
                        coluna_dia.innerHTML += "</ul>"
                }
            }
          } catch (erro) {
            alert(erro)
            coluna_dia.innerHTML = "Erro ao carregar horários!"

          }
       }

    </script>

</body>
</html>
